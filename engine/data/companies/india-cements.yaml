company: The India Cements Limited
fiscal_year: FY2026
capture: hand_seeded

# Read by hand from the FY2025-26 annual report, downloaded from BSE and kept at
# data/filings/india-cements-fy2026.pdf. Printed page numbers are cited below;
# the PDF page is three higher throughout.
#
# All values converted to plain rupees. The notes are denominated in lakhs and
# the Directors' Report in crores, which is the kind of thing that produces a
# hundredfold error if nobody writes it down.

sources:
  dr_results:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Directors' Report, Financial Results (Standalone), page 14 (PDF page 17)"
  note_37_3:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Note 37.3, Micro, Small and Medium Enterprises, page 147 (PDF page 150), figures in lakhs"
  caro_vii_a:
    doc_type: caro
    title: The India Cements Limited Independent Auditors' Report 2025-26
    year: FY2026
    locator: "CARO 2020 clause (vii)(a), page 104 (PDF page 107)"
  caro_annexure_i:
    doc_type: caro
    title: The India Cements Limited Independent Auditors' Report 2025-26
    year: FY2026
    locator: "Annexure (i) to the Auditors' Report, para 3(vii)(b) of CARO 2020, page 109 (PDF page 112)"

  crisil_2023:
    doc_type: credit_rating
    title: Crisil Ratings rationale, The India Cements Limited
    year: "2023"
    locator: "Rating action and Non cooperation by Issuer, 20 March 2023"
    url: "https://crisil.com/mnt/winshare/Ratings/RatingList/RatingDocs/TheIndiaCementsLimited_March%2020,%202023_RR_312753.html"

signals:
  - key: revenue
    value: 44846900000
    unit: INR
    kind: money
    as_filed: "4,484.69"
    filed_unit: crore
    source: dr_results
    note: "Revenue from operations, standalone, Rs 4,484.69 crore"

  - key: mse_principal_outstanding
    value: 119585000
    unit: INR
    kind: money
    as_filed: "1,195.85"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(a), Rs 1,195.85 lakhs. Closing balance, includes amounts not yet due"

  - key: mse_interest_accrued_unpaid
    value: 12334000
    unit: INR
    kind: money
    as_filed: "123.34"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(e), interest accrued and remaining unpaid, Rs 123.34 lakhs"

  - key: mse_interest_paid_during_year
    value: 14112000
    unit: INR
    kind: money
    as_filed: "141.12"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(c), interest actually paid on payments made beyond the due date, Rs 141.12 lakhs"

  # The auditor states positively that there were none. A filed zero is a
  # finding in its own right, so it is captured rather than left blank: the
  # engine tested H04 and found nothing instead of never testing it.
  - key: undisputed_statutory_dues_over_6m
    value: 0
    unit: INR
    kind: money
    as_filed: "0"
    filed_unit: lakh
    source: caro_vii_a
    note: "Auditor: no undisputed statutory dues in arrears over six months at 31-03-2026"

  - key: disputed_gst_dues
    value: 1904811038
    unit: INR
    kind: money
    as_filed: "1904811038"
    filed_unit: unit
    source: caro_annexure_i
    note: "GST sub-total, Rs 190,48,11,038, periods 2017-18 to 2022-23"

  - key: disputed_dues_total
    value: 9302553773
    unit: INR
    kind: money
    as_filed: "9302553773"
    filed_unit: unit
    source: caro_annexure_i
    note: "Grand total of all disputed dues, Rs 930.26 crore. Mostly pre-GST excise, customs and sales tax from 1995-96 onward, plus Rs 438.62 crore of electricity, stamp duty and mining cases"

  # Second source, and it finds nothing. Read in full, this rationale mentions
  # creditors, trade payables and liquidity nowhere, and neither does Crisil's
  # March 2026 rationale for Ramco Cements. Analysts write about payables only
  # once payables are the problem, so a rating document cannot discover one.
  # What it establishes is whether the company can act on a finding at all.
  - key: credit_rating_grade
    value: "BB"
    unit: grade
    kind: text
    source: crisil_2023
    note: "Long term revised to Crisil BB/Stable (Issuer Not Cooperating) from BBB/Negative, then withdrawn. No public rating since"

  - key: issuer_not_cooperating
    value: 1
    unit: flag
    kind: count
    source: crisil_2023
    note: "Crisil followed up by letter on 3 Jan, 3 Feb, 17 Feb and 23 Feb 2023 and received no response"

  - key: rating_withdrawn
    value: 1
    unit: flag
    kind: count
    source: crisil_2023
    note: "Withdrawn at the request of the company on receipt of no-dues certificates from its banks"
