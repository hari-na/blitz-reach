company: The India Cements Limited
fiscal_year: FY2026
capture: hand_seeded

# Read by hand from the FY2025-26 annual report, downloaded from BSE and kept at
# data/filings/india-cements-fy2026.pdf. Printed page numbers are cited below;
# the PDF page is three higher throughout.
#
# All values converted to plain rupees. The notes are denominated in lakhs and
# the Directors' Report in crores, which is the kind of thing that produces a
# hundredfold error if nobody writes it down.

sources:
  dr_results:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Directors' Report, Financial Results (Standalone), page 14 (PDF page 17)"
  note_37_3:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Note 37.3, Micro, Small and Medium Enterprises, page 147 (PDF page 150), figures in lakhs"
  caro_vii_a:
    doc_type: caro
    title: The India Cements Limited Independent Auditors' Report 2025-26
    year: FY2026
    locator: "CARO 2020 clause (vii)(a), page 104 (PDF page 107)"
  caro_annexure_i:
    doc_type: caro
    title: The India Cements Limited Independent Auditors' Report 2025-26
    year: FY2026
    locator: "Annexure (i) to the Auditors' Report, para 3(vii)(b) of CARO 2020, page 109 (PDF page 112)"

  crisil_2023:
    doc_type: credit_rating
    title: Crisil Ratings rationale, The India Cements Limited
    year: "2023"
    locator: "Rating action and Non cooperation by Issuer, 20 March 2023"
    url: "https://crisil.com/mnt/winshare/Ratings/RatingList/RatingDocs/TheIndiaCementsLimited_March%2020,%202023_RR_312753.html"

  brsr_p8:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "BRSR, Principle 8, Essential Indicator 4, page 80 (PDF page 83)"
  dr_subsidiaries:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Directors' Report, item 16, subsidiaries, page 44 (PDF page 47)"
  note_37_8_b:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Note 37.8(B), transactions with related parties, pages 151-152 (PDF pages 153-154)"
  kam_4:
    doc_type: annual_report
    title: The India Cements Limited Annual Report 2025-26
    year: FY2026
    locator: "Independent Auditor's Report, key audit matter 4, page 98 (PDF page 99)"

signals:
  - key: revenue
    value: 44846900000
    unit: INR
    kind: money
    as_filed: "4,484.69"
    filed_unit: crore
    source: dr_results
    note: "Revenue from operations, standalone, Rs 4,484.69 crore"

  - key: mse_principal_outstanding
    value: 119585000
    unit: INR
    kind: money
    as_filed: "1,195.85"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(a), Rs 1,195.85 lakhs. Closing balance, includes amounts not yet due"

  - key: mse_interest_accrued_unpaid
    value: 12334000
    unit: INR
    kind: money
    as_filed: "123.34"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(e), interest accrued and remaining unpaid, Rs 123.34 lakhs"

  - key: mse_interest_paid_during_year
    value: 14112000
    unit: INR
    kind: money
    as_filed: "141.12"
    filed_unit: lakh
    source: note_37_3
    note: "Note 37.3(c), interest actually paid on payments made beyond the due date, Rs 141.12 lakhs"

  # The auditor states positively that there were none. A filed zero is a
  # finding in its own right, so it is captured rather than left blank: the
  # engine tested H04 and found nothing instead of never testing it.
  - key: undisputed_statutory_dues_over_6m
    value: 0
    unit: INR
    kind: money
    as_filed: "0"
    filed_unit: unit
    source: caro_vii_a
    note: "Auditor: no undisputed statutory dues in arrears over six months at 31-03-2026"

  - key: disputed_gst_dues
    value: 1904811038
    unit: INR
    kind: money
    as_filed: "1904811038"
    filed_unit: unit
    source: caro_annexure_i
    note: "GST sub-total, Rs 190,48,11,038, periods 2017-18 to 2022-23"

  - key: disputed_dues_total
    value: 9302553773
    unit: INR
    kind: money
    as_filed: "9302553773"
    filed_unit: unit
    source: caro_annexure_i
    note: "Grand total of all disputed dues, Rs 930.26 crore. Mostly pre-GST excise, customs and sales tax from 1995-96 onward, plus Rs 438.62 crore of electricity, stamp duty and mining cases"

  # Second source, and it finds nothing. Read in full, this rationale mentions
  # creditors, trade payables and liquidity nowhere, and neither does Crisil's
  # March 2026 rationale for Ramco Cements. Analysts write about payables only
  # once payables are the problem, so a rating document cannot discover one.
  # What it establishes is whether the company can act on a finding at all.
  - key: credit_rating_grade
    value: "BB"
    unit: grade
    kind: text
    source: crisil_2023
    note: "Long term revised to Crisil BB/Stable (Issuer Not Cooperating) from BBB/Negative, then withdrawn. No public rating since"

  - key: issuer_not_cooperating
    value: 1
    unit: flag
    kind: count
    source: crisil_2023
    note: "Crisil followed up by letter on 3 Jan, 3 Feb, 17 Feb and 23 Feb 2023 and received no response"

  - key: rating_withdrawn
    value: 1
    unit: flag
    kind: count
    source: crisil_2023
    note: "Withdrawn at the request of the company on receipt of no-dues certificates from its banks"

  # Context, not a finding. Exposure to the MSMED regime, which decides whether
  # H01 reading nil would have meant anything. Filed as a percentage of input
  # material by value, with the prior year beside it.
  - key: msme_sourcing_share
    value: 0.17
    unit: share
    kind: ratio
    as_filed: "17"
    filed_unit: percent
    prior_value: 0.0112
    prior_as_filed: "1.12"
    source: brsr_p8
    note: "17% of input material by value, against 1.12% the previous year. A fifteenfold shift in one year is either a real change of supply base or a change of definition, and either is worth asking about"

  - key: subsidiary_count
    value: 4
    unit: entities
    kind: count
    as_filed: "4"
    filed_unit: unit
    source: dr_subsidiaries
    note: "Four subsidiaries, none of which the company considers material"

  # Context, not a finding. Trade volume with the group, summed from the four
  # trade blocks in note 37.8(B). Each block's printed total was checked
  # against its own per-party rows before being used:
  #   sale of goods          0.00 + 0.00 + 0.00 + 2,47,270.02 =  2,47,270.02
  #   purchase of goods          83.34 + 27,321.80            =     27,405.14
  #   rendering of services    1,774.00 + 734.36              =      2,508.36
  #   receiving of services  30.00 + 0.48 + 1,600.00          =      1,630.48
  #                                                             -------------
  #                                                              2,78,814.00
  # Financing flows in the same note (debenture redemption, amounts received
  # and repaid) and KMP remuneration are deliberately excluded: they are not
  # trade and folding them in would only make the number bigger.
  - key: related_party_trade_value
    value: 27881400000
    unit: INR
    kind: money
    as_filed: "278814.00"
    filed_unit: lakh
    prior_value: 3654149000
    prior_as_filed: "36541.49"
    source: note_37_8_b
    note: "Trade with related parties, 62% of revenue against 8% a year earlier. UltraTech took control in December 2024, so the group this company trades inside is new"

  # Context. The auditor independently named this as one of four matters most
  # significant in the whole audit, which is corroboration from someone who
  # read the ledgers rather than the annual report.
  - key: kam_related_party
    value: 1
    unit: flag
    kind: count
    as_filed: "1"
    filed_unit: unit
    source: kam_4
    note: "Key audit matter 4, \"Verification of Significant Related Party Transactions\""
