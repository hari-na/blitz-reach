company: LMW Limited
fiscal_year: FY2026
capture: hand_seeded

# Formerly Lakshmi Machine Works, Coimbatore. Textile spinning machinery, so a
# direct customer of shops like the one in interview 04.
#
# Read by hand from the FY2025-26 annual report, downloaded from BSE and kept at
# data/filings/lmw-fy2026.pdf. The report is laid out two printed pages to a PDF
# page, so both numbers are cited.
#
# This company is the reason the capture was worth doing. Every interest line in
# its MSMED note is nil, which is an audited statement that it pays its micro and
# small suppliers within the appointed day. H01 must stay silent here, and the
# verdict must come out abstain.

